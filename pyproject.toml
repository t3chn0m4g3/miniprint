[project]
name = "miniprint"
version = "0.2.0"
description = "A medium-interaction printer honeypot for PJL and passive web-admin probes."
readme = "README.md"
requires-python = ">=3.14,<3.15"
license = "GPL-3.0-or-later"
dependencies = [
    "pyfakefs>=6.2,<7",
]

[dependency-groups]
dev = [
    "bandit>=1.9,<2",
    "pip-audit>=2.9,<3",
    "pytest>=9.1,<10",
    "ruff>=0.14,<1",
]

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.bandit]
exclude_dirs = [".git", ".venv", "venv", "uploads", "log", "tests"]
